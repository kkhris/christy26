<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Christal Lyu Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <script>
      document.documentElement.classList.add("js");
    </script>
    <meta name="theme-color" content="#1c1c1c" />
    <style>
      :root {
        --bg: #ffffff;
        --text: #333333;
        --line: rgba(0, 0, 0, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        height: 100%;
        background: #ffffff;
        color-scheme: light;
      }

      body {
        margin: 0;
        min-height: 100%;
        color: var(--text);
        font-family: "Open Sans", Arial, sans-serif;
        font-size: 16px;
        letter-spacing: 0;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .app-shell {
        position: relative;
        height: 100%;
        min-height: 100%;
        background: var(--bg);
      }

      .font-prewarm {
        position: fixed;
        left: -9999px;
        top: 0;
        opacity: 0;
        pointer-events: none;
        user-select: none;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: clamp(240px, 15vw, 304px);
        padding: 46px clamp(48px, 3.32vw, 68px) 42px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: var(--bg);
      }

      .nav-links {
        display: grid;
        gap: 10px;
        align-content: start;
        margin-top: 11px;
      }

      .nav-links a {
        width: fit-content;
        font-size: 16px;
        line-height: 1;
        font-weight: 610;
        letter-spacing: -0.01em;
      }

      .contact h2,
      .site-footer h2 {
        margin: 0 0 3px;
        font-size: 20px;
        line-height: 1.2;
        font-weight: 700;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }

      .contact p,
      .site-footer p {
        margin: 0 0 7px;
        display: flex;
        gap: 16px;
        flex-wrap: nowrap;
        white-space: nowrap;
      }

      .contact a,
      .site-footer a,
      .contact small,
      .site-footer small {
        font-size: 16px;
        line-height: 1.3;
        white-space: nowrap;
      }

      .app-main {
        --page-left: clamp(336px, 22.85vw, 468px);
        --page-right: clamp(48px, 3.32vw, 68px);
        width: calc(100vw - var(--page-left));
        margin-left: var(--page-left);
        padding: 46px var(--page-right) 42px 0;
        background: var(--bg);
      }

      .intro {
        margin: 0 0 31px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
      }

      .intro h1 {
        margin: 0 0 4px;
        font-size: 36px;
        line-height: 1.4;
        font-weight: 700;
      }

      .intro p {
        margin: 0;
        font-size: 20px;
        line-height: 1.4;
        font-weight: 500;
      }

      .project-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: clamp(72px, 4.2vw, 86px) clamp(28px, 1.86vw, 38px);
      }

      .project-media {
        display: block;
        aspect-ratio: 4 / 3;
        overflow: hidden;
        background: #f7f5ef;
      }

      .site-footer {
        display: none;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1c;
          --text: #ededed;
          --line: rgba(255, 255, 255, 0.11);
        }

        html,
        body,
        #root {
          background: #1c1c1c;
          color-scheme: dark;
        }
      }

      @media (max-width: 809px) {
        html,
        body,
        #root {
          height: auto;
          min-height: 100%;
        }

        .sidebar {
          position: static;
          width: auto;
          padding: 28px 24px 10px;
          align-items: flex-start;
          gap: 18px;
        }

        .contact {
          display: none;
        }

        .app-main {
          width: auto;
          margin-left: 0;
          padding: 28px 24px 48px;
        }

        .project-grid {
          grid-template-columns: 1fr;
          gap: 44px;
        }

        .site-footer {
          display: block;
          padding: 24px 24px 40px;
          border-top: 1px solid var(--line);
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        html.js .page-reveal-target {
          opacity: 0;
          transform: translate3d(0, var(--page-reveal-y, 120px), 0);
        }

        html.js .page-reveal-case-nav,
        html.js .page-reveal-case-intro,
        html.js .page-reveal-case-study,
        html.js .page-reveal-grid {
          --page-reveal-y: 120px;
        }

        html.js .page-reveal-case-nav {
          transform: translate3d(0, var(--page-reveal-y, 120px), 0) translateY(-50%);
        }

        html.js .page-reveal-target.is-visible {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }

        html.js .page-reveal-case-nav.is-visible {
          transform: translate3d(0, 0, 0) translateY(-50%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
